name: Deploy to VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into VM and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/DashLumeAiBackend
            git fetch origin main
            git reset --hard origin/main
            npm ci --omit=dev
            pm2 restart dashlume-backend || pm2 start src/server.js --name dashlume-backend
            pm2 describe dashlume-backend > /dev/null
            pm2 status
